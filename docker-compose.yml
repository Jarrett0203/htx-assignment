services:
  postgres:
    image: postgres:17.4
    container_name: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432" # HOST_PORT:CONTAINER_PORT
    env_file:
      - .env 
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: